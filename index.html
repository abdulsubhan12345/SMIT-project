<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: whitesmoke;
        }
        .main{
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
            margin: 200px;
            
          
        }
        .left{
           justify-content: center;
           display: inline-block;
           
        }
        .btn{
            justify-content: center;
            margin-left: 160px;
            text-align: center;
            padding: 10px;
            background-color: white;
            width: 50%;
            height: 220px;
           
            
        }
        #face{
            color: rgb(18, 45, 246);
            font-size: xx-large;
           
        }
        #log{
            background-color: rgb(2, 63, 247);
            width: 100%;
            color: white;
            border-radius: 2px;
            margin-top: 10px;
            margin-bottom: 2px;
            padding: 8px;
           
        }
          #new{
            background-color:  rgb(23, 185, 23);
            color: white;
            padding: 8px;
            border-radius: 2px;
            margin-top: 8px;
            
          }
          #pas{
            margin-top: 10px;
            width: 90%;
            padding: 8px;
          }
          a{
            text-decoration: none;
          }
          #eml{
            width: 90%;
             padding: 8px;
          }
          .for{
            color: blue;
         
          }
    </style>
</head>
<body>
    <div class="main">
        <div class="left">
            <h2 id="face">Facebook</h2>
            <p>Connect with friends and the world arround you on facebook</p>
        </div>
        <div class="btn">
            <input id="eml" type="text" name="Enter email or phone number" placeholder="email or phone number">
            <br>
            <input id="pas" type="text" name="password" placeholder="password">
            <br>
            <button id="log">Login</button>
            <br>
            
            
            <a class="for" href="">forget password?</a>
            <hr>
            
            <button id="new">Create new account</button>
        </div>
    </div>
</body>
</html>
